name: Release

# Builds the installable panel bundle that App\Modules\Updater\App\Services\
# UpdateChecker/UpdateInstaller look for on GitHub Releases, and publishes it
# as a release asset.
#
# Triggered by pushing a tag "vX.Y.Z" - the config/panel.php comment says to
# bump `'version'` in the same commit you tag, and the "version matches tag"
# step below fails the build if that was forgotten, rather than publishing a
# release the panel's own UpdateChecker would then never consider new.
#
# The asset MUST contain vendor/ and a built public/build/ - UpdateInstaller
# refuses to install a bundle missing either, because a host with neither
# Composer nor Node (the common case for an already-installed panel) could
# never boot the result. That's also why this does not just attach GitHub's
# auto-generated source archive.

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # A tag name is attacker-influenced input, and `${{ }}` is substituted
      # into the script text *before* bash parses it - so interpolating a
      # tag straight into a `run:` block on a contents:write job lets a tag
      # like "v1.0.$(...)" execute on the release runner. Every step below
      # therefore reads the tag from the environment (where it is data, not
      # program text), and this step refuses anything that is not a plain
      # semver tag before it is used at all. The `v*.*.*` trigger glob is a
      # filter, not validation: it happily matches "v1.0.$(id)".
      - name: Validate the tag and resolve the version
        id: version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if ! printf '%s' "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::tag '$TAG' is not a plain vMAJOR.MINOR.PATCH tag - refusing to build a release from it."
            exit 1
          fi
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Confirm config/panel.php was bumped to this version
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          configured=$(grep -oP "'version'\s*=>\s*'\K[^']+" config/panel.php | head -n1)
          if [ "$configured" != "$VERSION" ]; then
            echo "::error::config/panel.php version '$configured' does not match tag version '$VERSION' - bump it in the same commit you tag."
            exit 1
          fi

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer:v2
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install PHP dependencies (production)
        run: composer install --no-dev --optimize-autoloader --no-interaction --prefer-dist

      - name: Install Node dependencies
        run: npm ci

      - name: Build frontend assets
        run: npm run build

      - name: Stage the release bundle
        run: |
          set -euo pipefail
          rm -rf /tmp/bundle
          mkdir -p /tmp/bundle
          # The bundle is exactly the tagged checkout plus build output
          # (vendor/, public/build). Nothing tracked is left out: the panel's
          # updater deletes files the running release shipped but the new
          # one lacks, and then points the server's git checkout at this
          # tag - a tracked path missing from the bundle (tests/ used to be)
          # would be deleted there and leave that checkout dirty. storage/
          # and .env are the only exclusions; the updater never touches
          # either on the server.
          rsync -a \
            --exclude='.git/' \
            --exclude='node_modules/' \
            --exclude='/.env' \
            --exclude='storage/' \
            --exclude='database/database.sqlite' \
            --exclude='.phpunit.cache/' \
            --exclude='.phpunit.result.cache' \
            ./ /tmp/bundle/

      - name: Reject a bundle containing symlinks
        # UpdateInstaller's own tar reader (untar) refuses any symlink or
        # hard-link entry when the release is installed - failing here instead
        # catches a bad bundle at build time rather than on every panel that
        # tries to update with it.
        run: |
          hits=$(find /tmp/bundle -type l)
          if [ -n "$hits" ]; then
            echo "::error::bundle contains symlinks, which UpdateInstaller refuses to install:"
            echo "$hits"
            exit 1
          fi

      - name: Verify vendor/ and public/build were actually staged
        run: |
          test -d /tmp/bundle/vendor
          test -f /tmp/bundle/public/build/manifest.json

      - name: Package the tarball
        id: package
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          name="s2panel-${VERSION}.tar.gz"
          tar -czf "$name" -C /tmp/bundle .
          echo "name=$name" >> "$GITHUB_OUTPUT"

      # Deliberately the preinstalled GitHub CLI rather than a third-party
      # release action: this job holds contents:write, and gh is already on
      # the runner, so there is no mutable third-party tag in the release
      # path to trust. (setup-php above stays third-party; if you want that
      # pinned to a commit SHA too, look the SHA up on GitHub - never guess
      # one, a wrong SHA fails the whole workflow.)
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          ASSET: ${{ steps.package.outputs.name }}
        run: gh release create "$TAG" "$ASSET" --title "$TAG" --generate-notes
