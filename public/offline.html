<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Offline</title>
    <style>
        /* Self-contained on purpose: this page has to render when the
           network is gone, so it cannot pull the app stylesheet. */
        :root { color-scheme: dark light; }
        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            background: #0c0c0e;
            color: #f4f4f5;
            font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
            text-align: center;
            padding: 1.5rem;
        }
        .card { max-width: 22rem; }
        h1 { font-size: 1.125rem; font-weight: 600; margin: 0 0 .5rem; }
        p { margin: 0 0 1.25rem; font-size: .875rem; color: #a1a1aa; line-height: 1.5; }
        button {
            font: inherit;
            font-size: .875rem;
            font-weight: 500;
            padding: .5rem 1rem;
            border-radius: .5rem;
            border: 1px solid #2b2b30;
            background: #18181b;
            color: #f4f4f5;
            cursor: pointer;
        }
        button:hover { background: #1f1f23; }
        @media (prefers-color-scheme: light) {
            body { background: #f9fafb; color: #18181b; }
            p { color: #52525b; }
            button { background: #fff; border-color: #e4e4e7; color: #18181b; }
            button:hover { background: #f4f4f5; }
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>You are offline</h1>
        <p>This page needs a connection. The panel shows live server and moderation data, so nothing is served from cache.</p>
        <button type="button" onclick="location.reload()">Retry</button>
    </div>
</body>
</html>
